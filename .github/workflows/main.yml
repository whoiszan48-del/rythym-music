
name: Build Rythim Glass APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Check Android project
        run: |
          echo "Checking project files..."
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found in repository root."
            echo "Upload the complete Android Studio project first."
            exit 1
          fi
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Find generated APK
        id: find_apk
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RythimGlass-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
